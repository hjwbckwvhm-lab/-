<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>خريطة عينة مراكز الابتكار في سلطنة عُمان</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{/* الأزرق من شعار GUtech؛ ألوان القطاعات متباينة عمداً لسهولة التمييز */--bg:#eef1f5;--surface:#fff;--ink:#12202f;--mute:#5b6b7a;--line:#d3dae2;
--gov:#0054a8;--uni:#e8890c;--pri:#8e44ad;--accent:#0054a8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e141b;--surface:#16202b;--ink:#e8edf2;--mute:#9aa8b6;--line:#2a3745;--gov:#5b9bef;--uni:#f5a742;--pri:#c58be0;--accent:#5b9bef}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
header{padding:14px 20px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.logo{height:56px;width:auto;background:#fff;border-radius:6px;padding:3px 8px}@media(max-width:820px){.logo{height:42px}}
header h1{font-size:1.15rem;margin:0;flex:1;min-width:240px;line-height:1.5}
header small{display:block;color:var(--mute);font-weight:400;font-size:.8rem}
button{font:inherit;cursor:pointer}
.lang{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:6px 12px}
.bar{display:flex;gap:18px;flex-wrap:wrap;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--line);align-items:center}
.grp{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.grp>span{color:var(--mute);font-size:.8rem;margin-inline-end:4px}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:4px 12px;font-size:.85rem;display:inline-flex;gap:6px;align-items:center}
.chip i{width:10px;height:10px;border-radius:50%;display:inline-block}
.chip[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
.chip:focus-visible,.lang:focus-visible,.row:focus-visible{outline:2px solid var(--uni);outline-offset:2px}
main{flex:1;display:grid;grid-template-columns:1fr 380px;min-height:0}
#map{min-height:420px;background:var(--line)}
aside{background:var(--surface);border-inline-start:1px solid var(--line);overflow:auto;padding:16px 18px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.kpi{background:var(--bg);border-radius:8px;padding:8px;text-align:center}
.kpi b{display:block;font-size:1.3rem}.kpi span{font-size:.72rem;color:var(--mute)}
h2{font-size:.95rem;margin:16px 0 8px}
.card{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
.card h3{margin:0 0 2px;font-size:1rem}.card .sub{color:var(--mute);font-size:.85rem;margin-bottom:8px}
.tag{display:inline-block;font-size:.75rem;padding:2px 8px;border-radius:999px;background:var(--bg);margin:0 0 4px 4px;border:1px solid var(--line)}
dl{margin:8px 0 0;font-size:.85rem;display:grid;grid-template-columns:auto 1fr;gap:4px 10px}
dt{color:var(--mute)}dd{margin:0;word-break:break-all;direction:ltr;text-align:start}
.row{display:flex;gap:8px;align-items:center;padding:7px 6px;border-bottom:1px solid var(--line);cursor:pointer;font-size:.88rem;border-radius:6px;background:none;width:100%;text-align:start;color:var(--ink);border-inline:0;border-top:0}
.row:hover{background:var(--bg)}
.row i{width:10px;height:10px;border-radius:50%;flex:none}
.pillar{border-inline-start:4px solid var(--accent);padding:6px 10px;margin-bottom:8px;background:var(--bg);border-radius:4px;font-size:.84rem}
.pillar b{display:block}.pillar em{font-style:normal;color:var(--mute)}
.note{font-size:.75rem;color:var(--mute);line-height:1.7;margin-top:12px}
.note a{color:var(--accent)}
.pin{width:26px;height:26px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.pin span{display:block;transform:rotate(45deg);color:#fff;font-size:11px;line-height:22px;text-align:center;font-weight:700}.pin.sel{outline:3px solid #fff;box-shadow:0 0 0 5px rgba(0,84,168,.5)}
.hx{display:flex;height:14px;border-radius:7px;overflow:hidden;margin:6px 0 4px}.hx i{display:block}.lg{display:flex;gap:10px;flex-wrap:wrap;font-size:.75rem;color:var(--mute);margin-bottom:6px}.lg b{display:inline-block;width:9px;height:9px;border-radius:50%;margin-inline-end:4px}.ins{font-size:.84rem;line-height:1.8;margin:6px 0;padding-inline-start:16px}.gap{color:#b3261e;font-weight:700}.mt{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:.84rem}@media(max-width:820px){main{grid-template-columns:1fr;grid-template-rows:55vh auto}aside{border-inline-start:0;border-top:1px solid var(--line)}.kpis{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
